version: "3.8"

services:
  ehs-ai-backend:
    image: ehs-ai-backend:1.0.5
    container_name: ehs-ai-backend
    ports:
      - "8000:8000"
    restart: always

  ehs-ai-frontend:
    image: ehs-ai-frontend:1.0.5
    container_name: ehs-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - ehs-ai-backend
    restart: always
